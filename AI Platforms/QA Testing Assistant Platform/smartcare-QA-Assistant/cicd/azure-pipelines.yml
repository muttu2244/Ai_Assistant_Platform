trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'windows-latest'

variables:
  pythonVersion: '3.11'
  artifactName: 'smartcare-qa-assistant'

stages:
  - stage: Build
    displayName: 'Package Deployment Artifact'
    jobs:
      - job: BuildJob
        displayName: 'Package Job'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                $scriptFile = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Filter "package_deployment.ps1" -Recurse |
                  Where-Object { $_.FullName -match "[\\/]cicd[\\/]package_deployment\.ps1$" } |
                  Select-Object -First 1

                if (-not $scriptFile) {
                  throw "Could not find cicd/package_deployment.ps1 under $(Build.SourcesDirectory)"
                }

                $projectRoot = Split-Path -Path $scriptFile.DirectoryName -Parent
                Write-Host "Detected project root: $projectRoot"
                Write-Host "##vso[task.setvariable variable=ProjectRoot]$projectRoot"
            pwsh: false
            displayName: 'Detect project root'

          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                Set-Location "$(ProjectRoot)"
                python --version
                python -m py_compile src/chat_ui/app.py
                python -m compileall src
            pwsh: false
            displayName: 'Validate Python sources'

          - task: PowerShell@2
            inputs:
              filePath: '$(ProjectRoot)/cicd/package_deployment.ps1'
              arguments: '-OutputRoot "$(Build.ArtifactStagingDirectory)" -BuildLabel "$(Build.BuildId)"'
              pwsh: false
            displayName: 'Create deployment bundle'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
              includeRootFolder: true
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: 'Archive deployment bundle'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: '$(artifactName)'
              publishLocation: 'Container'
            displayName: 'Publish artifacts'
