[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smartcare-qa-assistant"
version = "0.1.0"
description = "SmartCare QA Testing Assistant Platform — AI-powered, HIPAA-safe"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
smartcare-api = "src.chat_ui.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S"]
ignore = ["S101"]
